<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LexiScan Auto — Login</title>
  <meta name="description" content="Sign in to LexiScan Auto — AI-powered legal contract entity extractor." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #07071a;
      --bg2:        #0d0d2b;
      --surface:    rgba(255,255,255,0.04);
      --surface2:   rgba(255,255,255,0.07);
      --border:     rgba(255,255,255,0.08);
      --border2:    rgba(255,255,255,0.14);
      --text:       #e8e8f0;
      --text-muted: #7878a0;
      --purple:     #a855f7;
      --purple-dim: rgba(168,85,247,0.15);
      --cyan:       #06b6d4;
      --cyan-dim:   rgba(6,182,212,0.15);
      --green:      #10b981;
      --green-dim:  rgba(16,185,129,0.15);
      --red:        #ef4444;
      --red-dim:    rgba(239,68,68,0.12);
      --radius:     14px;
      --radius-sm:  8px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      line-height: 1.6;
    }

    /* ── Animated Background ───────────────────────────────────────── */
    .bg-scene {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    }
    .orb {
      position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.35;
      animation: drift 18s ease-in-out infinite;
    }
    .orb-1 {
      width: 600px; height: 600px; background: radial-gradient(circle, #a855f7, transparent);
      top: -150px; left: -150px;
    }
    .orb-2 {
      width: 500px; height: 500px; background: radial-gradient(circle, #06b6d4, transparent);
      bottom: -100px; right: -100px; animation-delay: -6s;
    }
    .orb-3 {
      width: 350px; height: 350px; background: radial-gradient(circle, #10b981, transparent);
      top: 50%; left: 50%; transform: translate(-50%,-50%); opacity: 0.12; animation-delay: -12s;
    }
    .grid-overlay {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
    }
    @keyframes drift {
      0%,100% { transform: translate(0,0) scale(1); }
      33%      { transform: translate(40px,-30px) scale(1.05); }
      66%      { transform: translate(-30px,40px) scale(0.95); }
    }

    /* ── Login Card ────────────────────────────────────────────────── */
    .auth-wrapper {
      position: relative; z-index: 1;
      width: 100%; max-width: 440px;
      padding: 20px;
      animation: fadeUp 0.55s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .brand-row {
      display: flex; align-items: center; gap: 10px;
      justify-content: center; margin-bottom: 32px;
    }
    .brand-icon {
      width: 42px; height: 42px; border-radius: 12px;
      background: linear-gradient(135deg, var(--purple), var(--cyan));
      display: grid; place-items: center; color: #fff; flex-shrink: 0;
    }
    .brand-name { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em; }
    .accent { color: var(--cyan); }

    .auth-card {
      background: rgba(13, 13, 43, 0.85);
      border: 1px solid var(--border2);
      border-radius: 20px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0,0,0,0.6), 0 0 0 1px rgba(168,85,247,0.08);
    }

    /* ── Tab bar inside card ───────────────────────────────────────── */
    .auth-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
    }
    .auth-tab {
      flex: 1; padding: 18px; text-align: center;
      font-size: 0.9rem; font-weight: 600; cursor: pointer;
      color: var(--text-muted); border: none; background: none;
      font-family: inherit; transition: all 0.25s;
      position: relative;
    }
    .auth-tab::after {
      content: ''; position: absolute; bottom: -1px; left: 0; right: 0;
      height: 2px; background: linear-gradient(90deg, var(--purple), var(--cyan));
      transform: scaleX(0); transition: transform 0.25s;
    }
    .auth-tab.active { color: var(--text); }
    .auth-tab.active::after { transform: scaleX(1); }
    .auth-tab:hover:not(.active) { color: var(--text); background: var(--surface); }

    /* ── Form panels ───────────────────────────────────────────────── */
    .auth-body { padding: 32px; }
    .auth-panel { display: none; flex-direction: column; gap: 20px; }
    .auth-panel.active { display: flex; }

    .form-greeting {
      margin-bottom: 4px;
    }
    .form-greeting h2 {
      font-size: 1.4rem; font-weight: 700; margin-bottom: 4px;
    }
    .form-greeting p {
      font-size: 0.85rem; color: var(--text-muted);
    }

    .field { display: flex; flex-direction: column; gap: 7px; }
    .field label {
      font-size: 0.8rem; font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.06em;
    }

    .input-wrap { position: relative; }
    .input-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); pointer-events: none; display: flex;
    }
    .field input {
      width: 100%; padding: 13px 16px 13px 42px;
      background: var(--surface2); border: 1px solid var(--border2);
      border-radius: var(--radius-sm); color: var(--text);
      font-family: inherit; font-size: 0.9rem; outline: none;
      transition: border 0.2s, box-shadow 0.2s;
    }
    .field input:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 3px rgba(168,85,247,0.12);
    }
    .field input::placeholder { color: var(--text-muted); opacity: 0.55; }

    /* show/hide password toggle */
    .toggle-pw {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--text-muted); cursor: pointer;
      padding: 4px; display: flex; transition: color 0.2s;
    }
    .toggle-pw:hover { color: var(--text); }

    /* ── Submit button ─────────────────────────────────────────────── */
    .submit-btn {
      padding: 15px; border-radius: var(--radius-sm); border: none; cursor: pointer;
      background: linear-gradient(135deg, var(--purple), var(--cyan));
      color: #fff; font-size: 1rem; font-weight: 700; font-family: inherit;
      transition: all 0.25s; box-shadow: 0 4px 24px rgba(168,85,247,0.3);
      position: relative; overflow: hidden;
    }
    .submit-btn:hover:not(:disabled) {
      transform: translateY(-2px); box-shadow: 0 8px 32px rgba(168,85,247,0.45);
    }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .submit-btn .btn-text { position: relative; z-index: 1; }
    .submit-btn .btn-shimmer {
      position: absolute; inset: 0;
      background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.15) 50%, transparent 60%);
      transform: translateX(-100%);
      animation: shimmer 2.5s ease infinite;
    }
    @keyframes shimmer {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }

    /* ── Alert / error box ─────────────────────────────────────────── */
    .alert {
      padding: 12px 16px; border-radius: var(--radius-sm);
      font-size: 0.83rem; display: none; align-items: flex-start; gap: 10px;
      animation: fadeUp 0.25s ease;
    }
    .alert.show { display: flex; }
    .alert-error  { background: var(--red-dim);   border: 1px solid rgba(239,68,68,0.3);  color: #fca5a5; }
    .alert-success{ background: var(--green-dim);  border: 1px solid rgba(16,185,129,0.3); color: #6ee7b7; }

    /* ── Demo hint ─────────────────────────────────────────────────── */
    .demo-hint {
      text-align: center; font-size: 0.75rem; color: var(--text-muted);
      padding: 14px 20px 20px;
      border-top: 1px solid var(--border);
    }
    .demo-hint code {
      font-family: 'JetBrains Mono', monospace;
      background: var(--surface2); padding: 2px 7px; border-radius: 4px;
      font-size: 0.72rem;
    }

    /* ── Spinner ───────────────────────────────────────────────────── */
    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.7s linear infinite; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- ── Animated Background ─────────────────────────────────────── -->
<div class="bg-scene" aria-hidden="true">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="grid-overlay"></div>
</div>

<!-- ── Auth Card ───────────────────────────────────────────────── -->
<div class="auth-wrapper">

  <!-- Brand -->
  <div class="brand-row">
    <div class="brand-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
        <polyline points="10 9 9 9 8 9"/>
      </svg>
    </div>
    <span class="brand-name">LexiScan <span class="accent">Auto</span></span>
  </div>

  <div class="auth-card">

    <!-- Tabs -->
    <div class="auth-tabs" role="tablist">
      <button class="auth-tab active" id="tab-login" role="tab" aria-selected="true" onclick="switchAuthTab('login')">Sign In</button>
      <button class="auth-tab" id="tab-register" role="tab" aria-selected="false" onclick="switchAuthTab('register')">Create Account</button>
    </div>

    <div class="auth-body">

      <!-- ── Login Panel ───────────────────────────────────────── -->
      <div class="auth-panel active" id="panel-login">
        <div class="form-greeting">
          <h2>Welcome back</h2>
          <p>Sign in to your LexiScan account</p>
        </div>

        <div id="login-alert" class="alert" role="alert"></div>

        <div class="field">
          <label for="login-username">Username</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            <input type="text" id="login-username" placeholder="Enter username" autocomplete="username"
                   onkeydown="if(event.key==='Enter') doLogin()" />
          </div>
        </div>

        <div class="field">
          <label for="login-password">Password</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input type="password" id="login-password" placeholder="Enter password" autocomplete="current-password"
                   onkeydown="if(event.key==='Enter') doLogin()" />
            <button class="toggle-pw" type="button" onclick="togglePw('login-password', this)" aria-label="Show password">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button class="submit-btn" id="login-btn" onclick="doLogin()">
          <div class="btn-shimmer"></div>
          <span class="btn-text">Sign In →</span>
        </button>
      </div>

      <!-- ── Register Panel ────────────────────────────────────── -->
      <div class="auth-panel" id="panel-register">
        <div class="form-greeting">
          <h2>Create account</h2>
          <p>Get started with LexiScan Auto for free</p>
        </div>

        <div id="register-alert" class="alert" role="alert"></div>

        <div class="field">
          <label for="reg-username">Username</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            <input type="text" id="reg-username" placeholder="Choose a username (min 3 chars)" autocomplete="username"
                   onkeydown="if(event.key==='Enter') doRegister()" />
          </div>
        </div>

        <div class="field">
          <label for="reg-email">Email Address</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
              </svg>
            </span>
            <input type="email" id="reg-email" placeholder="Enter your email address" autocomplete="email"
                   onkeydown="if(event.key==='Enter') doRegister()" />
          </div>
        </div>

        <div class="field">
          <label for="reg-password">Password</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input type="password" id="reg-password" placeholder="Choose a password (min 6 chars)" autocomplete="new-password"
                   onkeydown="if(event.key==='Enter') doRegister()" />
            <button class="toggle-pw" type="button" onclick="togglePw('reg-password', this)" aria-label="Show password">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="field">
          <label for="reg-confirm">Confirm Password</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </span>
            <input type="password" id="reg-confirm" placeholder="Repeat your password" autocomplete="new-password"
                   onkeydown="if(event.key==='Enter') doRegister()" />
          </div>
        </div>

        <button class="submit-btn" id="register-btn" onclick="doRegister()">
          <div class="btn-shimmer"></div>
          <span class="btn-text">Create Account →</span>
        </button>
      </div>

    </div><!-- /auth-body -->

    <!-- Demo hint -->
    <div class="demo-hint">
      Default credentials: <code>admin</code> / <code>admin123</code>
    </div>

  </div><!-- /auth-card -->
</div>

<script src="/static/auth.js"></script>
<script>
  // ── Redirect if already logged in ────────────────────────────────
  if (isLoggedIn()) {
    window.location.replace("/");
  }

  // ── Tab switching ─────────────────────────────────────────────────
  function switchAuthTab(tab) {
    document.querySelectorAll('.auth-tab').forEach(t => {
      t.classList.remove('active');
      t.setAttribute('aria-selected', 'false');
    });
    document.querySelectorAll('.auth-panel').forEach(p => p.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    document.getElementById('tab-' + tab).setAttribute('aria-selected', 'true');
    document.getElementById('panel-' + tab).classList.add('active');
    clearAlerts();
  }

  function clearAlerts() {
    document.querySelectorAll('.alert').forEach(el => {
      el.className = 'alert';
      el.textContent = '';
    });
  }

  function showAlert(id, message, type = 'error') {
    const el = document.getElementById(id);
    el.textContent = message;
    el.className = `alert show alert-${type}`;
  }

  // ── Show / hide password ──────────────────────────────────────────
  function togglePw(inputId, btn) {
    const inp = document.getElementById(inputId);
    if (inp.type === 'password') {
      inp.type = 'text';
      btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
    } else {
      inp.type = 'password';
      btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
    }
  }

  // ── Login ─────────────────────────────────────────────────────────
  async function doLogin() {
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    clearAlerts();

    if (!username || !password) {
      showAlert('login-alert', 'Please fill in both fields.');
      return;
    }

    const btn = document.getElementById('login-btn');
    btn.disabled = true;
    btn.querySelector('.btn-text').innerHTML = '<span class="spinner"></span> Signing in…';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.detail || 'Login failed.');
      }

      setToken(data.access_token);

      // Fetch user profile info (including email) to store locally
      try {
        const meRes = await authFetch('/api/auth/me');
        if (meRes.ok) {
          const meData = await meRes.json();
          setStoredUser(meData);
        } else {
          setStoredUser({ username });
        }
      } catch (meErr) {
        setStoredUser({ username });
      }

      showAlert('login-alert', '✓ Signed in! Redirecting…', 'success');
      setTimeout(() => window.location.replace('/'), 700);

    } catch (err) {
      showAlert('login-alert', err.message);
      btn.disabled = false;
      btn.querySelector('.btn-text').textContent = 'Sign In →';
    }
  }

  // ── Register ──────────────────────────────────────────────────────
  async function doRegister() {
    const username = document.getElementById('reg-username').value.trim();
    const email    = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;
    const confirm  = document.getElementById('reg-confirm').value;
    clearAlerts();

    if (!username || !email || !password || !confirm) {
      showAlert('register-alert', 'Please fill in all fields.');
      return;
    }
    if (username.length < 3) {
      showAlert('register-alert', 'Username must be at least 3 characters.');
      return;
    }
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(email)) {
      showAlert('register-alert', 'Please enter a valid email address.');
      return;
    }
    if (password.length < 6) {
      showAlert('register-alert', 'Password must be at least 6 characters.');
      return;
    }
    if (password !== confirm) {
      showAlert('register-alert', 'Passwords do not match.');
      return;
    }

    const btn = document.getElementById('register-btn');
    btn.disabled = true;
    btn.querySelector('.btn-text').innerHTML = '<span class="spinner"></span> Creating account…';

    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, password }),
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.detail || 'Registration failed.');
      }

      // Auto-login after registration
      const loginRes = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const loginData = await loginRes.json();
      if (loginRes.ok) {
        setToken(loginData.access_token);
        
        // Fetch full profile info to store email locally
        try {
          const meRes = await authFetch('/api/auth/me');
          if (meRes.ok) {
            const meData = await meRes.json();
            setStoredUser(meData);
          } else {
            setStoredUser({ username, email });
          }
        } catch (meErr) {
          setStoredUser({ username, email });
        }

        showAlert('register-alert', '✓ Account created! Redirecting…', 'success');
        setTimeout(() => window.location.replace('/'), 800);
      } else {
        showAlert('register-alert', '✓ Account created! Please sign in.', 'success');
        setTimeout(() => switchAuthTab('login'), 1200);
      }

    } catch (err) {
      showAlert('register-alert', err.message);
      btn.disabled = false;
      btn.querySelector('.btn-text').textContent = 'Create Account →';
    }
  }
</script>
</body>
</html>
